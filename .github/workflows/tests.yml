name: tests

on:
  push:
    branches: [main]
  pull_request:

# La suite de tests tourne sur les 3 systèmes ET aux deux extrémités des versions de
# Python annoncées dans le README (3.9 = celui que macOS fournit ; 3.13 = le plus récent
# testé) : c'est cette vérification qui compte, pas une hypothèse.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
